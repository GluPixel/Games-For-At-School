<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dylans Arcade V9</title>

<style>
:root{
--bg:#060812;
--bg2:#0d1230;
--panel:#141b33;
--line:rgba(255,255,255,.08);
--text:#f6f8ff;
--accent:#7c5cff;
--blue:#38c6ff;
--red:#ff3b5c;
}

*{box-sizing:border-box;margin:0;padding:0;}

body{
font-family:Arial;
background:linear-gradient(180deg,var(--bg),var(--bg2));
color:var(--text);
min-height:100vh;
overflow-y:auto;
}

/* SIDEBAR */
.sidebar{
position:fixed;
left:0;top:0;
width:260px;height:100vh;
background:#0a1020;
border-right:1px solid var(--line);
padding:14px;
}

/* MAIN */
.main{
margin-left:260px;
padding:16px;
}

/* ADD BOX */
.addBox{
background:var(--panel);
padding:12px;
border-radius:14px;
display:grid;
gap:8px;
margin-bottom:14px;
}

.addBox input{
padding:10px;
border-radius:10px;
border:none;
background:#0f1428;
color:white;
}

.addBtn{
padding:10px;
border:none;
border-radius:10px;
background:linear-gradient(135deg,var(--accent),var(--blue));
color:white;
font-weight:bold;
cursor:pointer;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
gap:12px;
}

/* CARD */
.card{
background:var(--panel);
border-radius:14px;
overflow:hidden;
border:1px solid var(--line);
display:flex;
flex-direction:column;
}

.thumb{
height:140px;
display:flex;
align-items:center;
justify-content:center;
background:#0f1428;
}

.thumb img{
max-width:100%;
max-height:100%;
}

.info{
padding:12px;
display:flex;
flex-direction:column;
gap:6px;
}

/* BUTTON ROW */
.actions{
display:flex;
gap:8px;
margin-top:8px;
}

.play{
flex:1;
padding:10px;
border:none;
border-radius:10px;
background:linear-gradient(135deg,var(--accent),var(--blue));
color:white;
font-weight:bold;
cursor:pointer;
}

.delete{
padding:10px;
border:none;
border-radius:10px;
background:var(--red);
color:white;
font-weight:bold;
cursor:pointer;
}

/* FORCE DELETE VISIBILITY */
.delete:hover{
filter:brightness(1.2);
}

/* PLAYER */
.player{
display:none;
margin-top:16px;
height:70vh;
border-radius:14px;
overflow:hidden;
}

iframe{
width:100%;
height:100%;
border:none;
}
</style>
</head>

<body>

<div class="sidebar">
<h2>🎮 Arcade V9</h2>
</div>

<div class="main">

<!-- ADD GAME -->
<div class="addBox">
<input id="name" placeholder="Game Name">
<input id="cat" placeholder="Category">
<input id="url" placeholder="Game URL">
<input id="img" placeholder="Image URL">
<button class="addBtn" onclick="addGame()">➕ Add Game</button>
</div>

<div class="grid" id="grid"></div>

<div class="player">
<iframe id="frame"></iframe>
</div>

</div>

<script>

let games = JSON.parse(localStorage.getItem("games")) || [
{
name:"Bloons Battles",
cat:"strategy",
url:"https://kiz10.com/embed-play/bloons-battles/",
img:"https://cdn.kiz10.com/upload/thumbnails/21132/1757453520_bloons-battles.webp"
},
{
name:"Paper Flight",
cat:"flying",
url:"https://www.rocketgames.io/embed/paper-flight",
img:"https://www.speldome.com/wp-content/uploads/thumbs/gamedistribution/P/paper-flight.jpeg"
},
{
name:"Shell Shockers",
cat:"multiplayer",
url:"https://sites.google.com/bluewizard.com/play-shell/home",
img:"https://upload.wikimedia.org/wikipedia/en/3/3f/Shell_Shockers_logo.png"
}
];

function save(){
localStorage.setItem("games",JSON.stringify(games));
}

/* ADD GAME (FIXED) */
function addGame(){

let n=document.getElementById("name").value.trim();
let c=document.getElementById("cat").value.trim();
let u=document.getElementById("url").value.trim();
let i=document.getElementById("img").value.trim();

if(!n||!u||!i){
alert("Fill all fields");
return;
}

games.push({name:n,cat:c,url:u,img:i});
save();
render();

document.getElementById("name").value="";
document.getElementById("cat").value="";
document.getElementById("url").value="";
document.getElementById("img").value="";
}

/* DELETE (FIXED RELIABLE INDEX) */
function deleteGame(index){
games.splice(index,1);
save();
render();
}

/* PLAY */
function play(url){
document.getElementById("frame").src=url;
document.querySelector(".player").style.display="block";
}

/* RENDER (FIXED INDEX BINDING) */
function render(){
let g=document.getElementById("grid");
g.innerHTML="";

games.forEach((x,index)=>{

g.innerHTML+=`
<div class="card">
<div class="thumb">
<img src="${x.img}">
</div>

<div class="info">
<h3>${x.name}</h3>
<div>${x.cat}</div>

<div class="actions">
<button class="play" onclick="play('${x.url}')">Play</button>
<button class="delete" onclick="deleteGame(${index})">🗑 Delete</button>
</div>

</div>
</div>`;
});
}

render();

</script>

</body>
</html>
