<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dylans Arcade</title>

<style>
:root{
--bg:#060812;
--bg2:#0d1230;
--panel:#141b33;
--line:rgba(255,255,255,.08);
--text:#f6f8ff;
--accent:#7c5cff;
--blue:#38c6ff;
--red:#ff4d6d;
}

*{box-sizing:border-box;margin:0;padding:0;}

body{
font-family:Arial;
background:linear-gradient(180deg,var(--bg),var(--bg2));
color:var(--text);
min-height:100vh;
overflow-y:auto;
}

/* SIDEBAR */
.sidebar{
position:fixed;
left:0;top:0;
width:260px;height:100vh;
background:#0a1020;
border-right:1px solid var(--line);
padding:14px;
}

.logo{
font-size:20px;
font-weight:900;
padding:14px;
border-radius:14px;
text-align:center;
background:linear-gradient(135deg,var(--accent),var(--blue));
margin-bottom:10px;
}

/* MAIN */
.main{
margin-left:260px;
padding:16px;
}

/* ADD BOX */
.addBox{
background:var(--panel);
padding:12px;
border-radius:14px;
display:grid;
gap:8px;
margin-bottom:14px;
}

.addBox input{
padding:10px;
border:none;
border-radius:10px;
background:#0f1428;
color:white;
}

.addBtn{
padding:10px;
border:none;
border-radius:10px;
background:linear-gradient(135deg,var(--accent),var(--blue));
color:white;
font-weight:bold;
cursor:pointer;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
gap:12px;
}

/* CARD */
.card{
background:var(--panel);
border-radius:14px;
overflow:hidden;
border:1px solid var(--line);
}

.thumb{
height:140px;
display:flex;
align-items:center;
justify-content:center;
background:#0f1428;
}

.thumb img{
max-width:100%;
max-height:100%;
display:block;
}

.info{
padding:12px;
}

.actions{
display:flex;
gap:6px;
margin-top:10px;
}

.play{
flex:1;
padding:10px;
border:none;
border-radius:10px;
background:linear-gradient(135deg,var(--accent),var(--blue));
color:white;
font-weight:bold;
cursor:pointer;
}

.delete{
padding:10px;
border:none;
border-radius:10px;
background:var(--red);
color:white;
cursor:pointer;
}

/* PLAYER */
.player{
display:none;
position:fixed;
top:0;left:0;
width:100vw;
height:100vh;
background:black;
z-index:9999;
}

iframe{
width:100%;
height:100%;
border:none;
}

.exitBtn{
position:absolute;
top:10px;
right:10px;
padding:10px 14px;
border:none;
border-radius:10px;
background:rgba(0,0,0,.6);
color:white;
cursor:pointer;
}

/* PANIC BUTTON */
.panicBtn{
position:fixed;
top:10px;
right:10px;
z-index:100000;

padding:8px 10px;
font-size:12px;

border:none;
border-radius:10px;

background:linear-gradient(135deg,var(--accent),var(--blue));
color:white;
font-weight:bold;
cursor:pointer;
opacity:0.9;
}

</style>
</head>

<body>

<!-- PANIC BUTTON (OPEN GOOGLE) -->
<button class="panicBtn" onclick="openPanic()">📊 Panic</button>

<!-- SIDEBAR -->
<div class="sidebar">
<div class="logo">🎮 Arcade</div>
</div>

<!-- MAIN -->
<div class="main">

<div class="addBox">
<input id="name" placeholder="Game Name">
<input id="cat" placeholder="Category">
<input id="url" placeholder="Game URL">
<input id="img" placeholder="Image URL">
<button class="addBtn" onclick="addGame()">➕ Add Game</button>
</div>

<div class="grid" id="grid"></div>

</div>

<!-- PLAYER -->
<div class="player" id="player">
<button class="exitBtn" onclick="exitGame()">✖ Exit</button>
<iframe id="frame"></iframe>
</div>

<script>

/* LOAD SAVED GAMES */
let games = JSON.parse(localStorage.getItem("games")) || [
{
name:"Bloons Battles",
cat:"strategy",
url:"https://kiz10.com/embed-play/bloons-battles/",
img:"https://cdn.kiz10.com/upload/thumbnails/21132/1757453520_bloons-battles.webp"
},
{
name:"Paper Flight",
cat:"flying",
url:"https://www.rocketgames.io/embed/paper-flight",
img:"https://www.speldome.com/wp-content/uploads/thumbs/gamedistribution/P/paper-flight.jpeg"
},
{
name:"Minecraft",
cat:"sandbox",
url:"https://mcraft.fun",
img:"https://tse4.mm.bing.net/th/id/OIP.JzuDWurtzG4ylwJNGwKbHQHaEK?pid=Api&P=0&h=180"
}
];

function save(){
localStorage.setItem("games",JSON.stringify(games));
}

/* ADD GAME */
function addGame(){

let n=document.getElementById("name").value.trim();
let c=document.getElementById("cat").value.trim();
let u=document.getElementById("url").value.trim();
let i=document.getElementById("img").value.trim();

if(!n||!u||!i){
alert("Fill all fields");
return;
}

games.push({name:n,cat:c,url:u,img:i});
save();
render();

document.getElementById("name").value="";
document.getElementById("cat").value="";
document.getElementById("url").value="";
document.getElementById("img").value="";
}

/* RENDER */
function render(){
let g=document.getElementById("grid");
g.innerHTML="";

games.forEach((x,i)=>{
g.innerHTML+=`
<div class="card">
<div class="thumb">
<img src="${x.img}">
</div>

<div class="info">
<h3>${x.name}</h3>
<div>${x.cat}</div>

<div class="actions">
<button class="play" onclick="play('${x.url}')">Play</button>
<button class="delete" onclick="deleteGame(${i})">🗑</button>
</div>

</div>
</div>`;
});
}

render();

/* PLAY */
function play(url){
document.getElementById("frame").src=url;
document.getElementById("player").style.display="block";
}

/* EXIT GAME */
function exitGame(){
document.getElementById("player").style.display="none";
document.getElementById("frame").src="";
}

/* DELETE */
function deleteGame(i){
games.splice(i,1);
save();
render();
}

/* PANIC MODE → OPEN GOOGLE */
function openPanic(){
window.open("https://www.google.com","_blank");
}

</script>

</body>
</html>
