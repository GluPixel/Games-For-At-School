<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dylans Arcade SAFE V5</title>

<style>
:root{
--bg:#060812;
--bg2:#0d1230;
--panel:#141b33;
--line:rgba(255,255,255,.08);
--text:#f6f8ff;
--accent:#7c5cff;
--blue:#38c6ff;
}

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:linear-gradient(180deg,var(--bg),var(--bg2));
color:var(--text);

/* IMPORTANT: allow normal page scroll */
overflow-y:auto;
overflow-x:hidden;
min-height:100vh;
}

/* FIXED SIDEBAR (does NOT affect scrolling) */
.sidebar{
position:fixed;
top:0;
left:0;
width:260px;
height:100vh;
background:#0a1020;
border-right:1px solid var(--line);
padding:14px;
overflow-y:auto;
}

.logo{
font-size:20px;
font-weight:900;
padding:14px;
border-radius:14px;
text-align:center;
background:linear-gradient(135deg,var(--accent),var(--blue));
margin-bottom:10px;
}

.profile{
background:var(--panel);
padding:10px;
border-radius:12px;
font-size:12px;
margin-bottom:10px;
}

.sideBtn{
width:100%;
padding:10px;
margin:5px 0;
border:none;
border-radius:10px;
background:var(--panel);
color:white;
cursor:pointer;
text-align:left;
}

/* MAIN PAGE CONTENT (NORMAL FLOW — THIS FIXES EVERYTHING) */
.main{
margin-left:260px;
padding:14px;
}

/* HERO */
.hero{
padding:16px;
border-radius:14px;
background:linear-gradient(135deg,var(--accent),#3b82f6);
margin-bottom:14px;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
gap:12px;
}

/* CARD */
.card{
background:var(--panel);
border-radius:14px;
overflow:hidden;
border:1px solid var(--line);
transition:.15s;
}

.card:hover{
transform:translateY(-4px);
}

.thumb{
height:140px;
display:flex;
align-items:center;
justify-content:center;
background:#0f1428;
}

.thumb img{
max-width:100%;
max-height:100%;
}

.info{
padding:12px;
}

.tags{
font-size:11px;
opacity:.7;
}

.actions{
display:flex;
gap:6px;
margin-top:10px;
}

.play{
flex:1;
padding:10px;
border:none;
border-radius:10px;
background:linear-gradient(135deg,var(--accent),var(--blue));
color:white;
font-weight:bold;
cursor:pointer;
}

.like{
background:#26324d;
border:none;
border-radius:10px;
padding:10px;
color:white;
cursor:pointer;
}

.badge{
font-size:12px;
color:#ffb3c1;
margin-top:6px;
}

/* PLAYER */
.player{
display:none;
margin-top:16px;
height:70vh;
border-radius:14px;
overflow:hidden;
}

iframe{
width:100%;
height:100%;
border:none;
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
<div class="logo">🎮 Arcade SAFE</div>
<div class="profile" id="profile">Player: Guest</div>

<button class="sideBtn" onclick="setName()">👤 Name</button>
<button class="sideBtn" onclick="showAll()">🔥 All</button>
<button class="sideBtn" onclick="showTrending()">🏆 Trending</button>
</div>

<!-- MAIN PAGE -->
<div class="main">

<div class="hero">
<h2>Dylans Arcade SAFE MODE</h2>
<p>Fixed scrolling — no clipping — no broken layout</p>
</div>

<div class="grid" id="grid"></div>

<div class="player" id="player">
<iframe id="frame"></iframe>
</div>

</div>

<script>

let games=[
{name:"Bloons Battles",cat:"strategy",url:"https://kiz10.com/embed-play/bloons-battles/",img:"https://cdn.kiz10.com/upload/thumbnails/21132/1757453520_bloons-battles.webp"},
{name:"Paper Flight",cat:"flying",url:"https://www.rocketgames.io/embed/paper-flight",img:"https://www.speldome.com/wp-content/uploads/thumbs/gamedistribution/P/paper-flight.jpeg"},
{name:"Shell Shockers",cat:"multiplayer",url:"https://shellshock.io/",img:"https://shellshock.io/img/favicon.png"}
];

let likes=JSON.parse(localStorage.getItem("likes")||"{}");
let playerName=localStorage.getItem("name")||"Guest";

function setName(){
let n=prompt("Name?");
if(!n)return;
playerName=n;
localStorage.setItem("name",n);
document.getElementById("profile").innerText="Player: "+n;
}

function render(list=games){
let g=document.getElementById("grid");
g.innerHTML="";

list.forEach(x=>{
let l=likes[x.name]||0;

g.innerHTML+=`
<div class="card">
<div class="thumb"><img src="${x.img}"></div>
<div class="info">
<h3>${x.name}</h3>
<div class="tags">${x.cat}</div>
<div class="badge">❤️ ${l}</div>
<div class="actions">
<button class="play" onclick="play('${x.url}')">Play</button>
<button class="like" onclick="like('${x.name}')">❤️</button>
</div>
</div>
</div>`;
});
}

function like(name){
likes[name]=(likes[name]||0)+1;
localStorage.setItem("likes",JSON.stringify(likes));
render();
}

function play(url){
document.getElementById("frame").src=url;
document.getElementById("player").style.display="block";
}

function showAll(){render(games);}

function showTrending(){
render([...games].sort((a,b)=>(likes[b.name]||0)-(likes[a.name]||0)));
}

render();
document.getElementById("profile").innerText="Player: "+playerName;

</script>

</body>
</html>
