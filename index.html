<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dylans Arcade V17</title>

<style>
:root{
--bg:#060812;
--bg2:#0d1230;
--panel:#141b33;
--text:#eaf0ff;
--accent:#7c5cff;
--blue:#38c6ff;
--red:#ff4d6d;
}

*{box-sizing:border-box;margin:0;padding:0;}

body{
font-family:Arial;
background:linear-gradient(180deg,var(--bg),var(--bg2));
color:var(--text);
min-height:100vh;
overflow-y:auto;
}

/* SIDEBAR */
.sidebar{
position:fixed;
left:0;top:0;
width:260px;height:100vh;
background:#0a1020;
padding:14px;
}

.main{
margin-left:260px;
padding:16px;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
gap:12px;
}

.card{
background:var(--panel);
padding:12px;
border-radius:14px;
}

/* PLAYER */
.player{
display:none;
position:fixed;
top:0;left:0;
width:100vw;
height:100vh;
background:black;
z-index:50;
}

iframe{
width:100%;
height:100%;
border:none;
}

.exitBtn{
position:absolute;
top:10px;
right:10px;
z-index:60;
padding:10px 14px;
border:none;
border-radius:10px;
background:rgba(0,0,0,.6);
color:white;
cursor:pointer;
}

/* PANIC MODE */
.panic{
display:none;
position:fixed;
top:0;left:0;
width:100vw;
height:100vh;
background:#0f172a;
z-index:99999;
}

.panicHeader{
display:flex;
justify-content:space-between;
align-items:center;
padding:10px 14px;
background:#111c33;
border-bottom:1px solid rgba(255,255,255,.1);
}

.sheet{
display:grid;
grid-template-columns:repeat(10,1fr);
gap:2px;
padding:16px;
}

.cell{
background:#111827;
border:1px solid rgba(255,255,255,.05);
min-height:32px;
font-size:11px;
padding:6px;
}

.tab{
background:#1f2937;
padding:6px 10px;
border-radius:8px;
font-size:12px;
margin-left:6px;
}

.close{
padding:8px 12px;
border:none;
border-radius:8px;
background:#ef4444;
color:white;
cursor:pointer;
}
</style>
</head>

<body>

<!-- ARCADE -->
<div class="sidebar">
<h3>🎮 Arcade V17</h3>
</div>

<div class="main">
<div class="grid" id="grid"></div>
</div>

<!-- PLAYER -->
<div class="player" id="player">
<button class="exitBtn" onclick="exitGame()">✖ Exit</button>
<iframe id="frame"></iframe>
</div>

<!-- PANIC MODE -->
<div class="panic" id="panic">

<div class="panicHeader">
<div>
📊 Spreadsheet Mode
<span class="tab">File</span>
<span class="tab">Edit</span>
<span class="tab">View</span>
</div>

<button class="close" onclick="exitPanic()">Exit</button>
</div>

<div class="sheet" id="sheet"></div>

</div>

<script>

let games=[
{name:"Bloons",url:"https://kiz10.com/embed-play/bloons-battles/"},
{name:"Paper Flight",url:"https://www.rocketgames.io/embed/paper-flight"},
{name:"Minecraft",url:"https://mcraft.fun"}
];

/* RENDER */
function render(){
let g=document.getElementById("grid");
g.innerHTML="";

games.forEach(x=>{
g.innerHTML+=`
<div class="card">
<h4>${x.name}</h4>
<button onclick="play('${x.url}')">Play</button>
</div>`;
});
}

render();

/* PLAY */
function play(url){
document.getElementById("frame").src=url;
document.getElementById("player").style.display="block";
}

/* EXIT GAME */
function exitGame(){
document.getElementById("player").style.display="none";
document.getElementById("frame").src="";
}

/* PANIC MODE OPEN */
function openPanic(){

document.getElementById("panic").style.display="block";

let s=document.getElementById("sheet");
s.innerHTML="";

for(let i=0;i<250;i++){
s.innerHTML+=`<div class="cell">${Math.floor(Math.random()*9999)}</div>`;
}
}

/* PANIC MODE EXIT */
function exitPanic(){
document.getElementById("panic").style.display="none";
}

/* HOTKEYS */
document.addEventListener("keydown",function(e){

// Ctrl + Alt + 1 → PANIC MODE
if(e.ctrlKey && e.altKey && e.code==="Digit1"){
e.preventDefault();
openPanic();
}

});

</script>

</body>
</html>
