<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dylans Arcade V4</title>

<style>
:root{
--bg:#070a12;
--bg2:#0e1430;
--panel:#151c33;
--panel2:#1e2950;
--line:rgba(255,255,255,.08);
--text:#f6f8ff;
--muted:#9aa7d1;
--accent:#7c5cff;
--blue:#38c6ff;
--green:#2fd27f;
--red:#ff5b6e;
--gold:#ffcc66;
}

*{box-sizing:border-box;margin:0;padding:0}
body{
font-family:Arial,Helvetica,sans-serif;
background:linear-gradient(180deg,var(--bg),var(--bg2));
color:var(--text);
overflow:hidden;
height:100vh;
}

.app{display:grid;grid-template-columns:260px 1fr;height:100vh}

.sidebar{
background:#0b1020;
padding:16px;
border-right:1px solid var(--line);
overflow-y:auto;
}

.logo{
font-size:22px;
font-weight:900;
padding:14px;
border-radius:14px;
text-align:center;
background:linear-gradient(135deg,var(--accent),var(--blue));
margin-bottom:12px;
}

.profile{
background:var(--panel);
padding:10px;
border-radius:12px;
margin-bottom:10px;
font-size:13px;
}

.sideBtn{
width:100%;padding:10px;margin:6px 0;
border:none;border-radius:10px;
background:var(--panel);
color:white;cursor:pointer;text-align:left;
}

.main{display:flex;flex-direction:column}

.topbar{
padding:12px;
border-bottom:1px solid var(--line);
background:#0b1020;
display:flex;gap:10px;
}

.search{
flex:1;padding:12px;border-radius:12px;
border:none;background:var(--panel);
color:white;
}

.content{padding:16px;overflow-y:auto}

.hero{
padding:16px;
border-radius:14px;
background:linear-gradient(135deg,var(--accent),#3b82f6);
margin-bottom:14px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
gap:14px;
}

.card{
background:var(--panel);
border-radius:14px;
overflow:hidden;
border:1px solid var(--line);
transition:.15s;
}

.card:hover{transform:translateY(-4px)}

.thumb{height:140px;display:flex;align-items:center;justify-content:center;background:#0f1428}
.thumb img{max-width:100%;max-height:100%}

.info{padding:12px}

.tags{font-size:11px;color:var(--muted)}

.actions{display:flex;gap:6px;margin-top:10px}

button{cursor:pointer}

.play{
flex:1;padding:10px;border:none;border-radius:10px;
background:linear-gradient(135deg,var(--accent),var(--blue));
color:white;font-weight:bold;
}

.like{
background:#26324d;border:none;border-radius:10px;
padding:10px;color:white;
}

.badge{font-size:12px;color:#ffb3c1;margin-top:6px}

.player{display:none;height:70vh;margin-top:12px;border-radius:14px;overflow:hidden}
iframe{width:100%;height:100%;border:none}

.toast{
position:fixed;bottom:20px;right:20px;
background:#111a33;padding:10px 14px;
border-radius:10px;border:1px solid var(--line);
opacity:0;transform:translateY(10px);
transition:.3s;
}
.toast.show{opacity:1;transform:translateY(0)}

.leaderboard{font-size:13px;color:var(--muted);margin-bottom:10px}

.confetti{
position:fixed;top:0;left:0;pointer-events:none;
width:100%;height:100%;
}
</style>
</head>

<body>

<canvas class="confetti" id="confetti"></canvas>
<div class="toast" id="toast"></div>

<div class="app">

<div class="sidebar">
<div class="logo">🎮 Arcade V4</div>

<div class="profile" id="profile">Player: Guest</div>

<button class="sideBtn" onclick="setName()">👤 Set Name</button>
<button class="sideBtn" onclick="showAll()">🔥 All Games</button>
<button class="sideBtn" onclick="showTrending()">🏆 Trending</button>
<button class="sideBtn" onclick="showLeaderboard()">📊 Leaderboard</button>
</div>

<div class="main">

<div class="topbar">
<input class="search" placeholder="Search games..." oninput="search(this.value)">
</div>

<div class="content">

<div class="hero">
<h2>Dylans Arcade V4</h2>
<p>🔥 likes • leaderboard • profiles • animations • trending AI system</p>
</div>

<div class="leaderboard" id="board"></div>
<div class="grid" id="grid"></div>
<div class="player" id="player"><iframe id="frame"></iframe></div>

</div>
</div>
</div>

<script>

let games=[
{name:"Bloons Battles",cat:"strategy",url:"https://kiz10.com/embed-play/bloons-battles/",img:"https://cdn.kiz10.com/upload/thumbnails/21132/1757453520_bloons-battles.webp"},
{name:"Paper Flight",cat:"flying",url:"https://www.rocketgames.io/embed/paper-flight",img:"https://www.speldome.com/wp-content/uploads/thumbs/gamedistribution/P/paper-flight.jpeg"},
{name:"Shell Shockers",cat:"multiplayer",url:"https://shellshock.io/",img:"https://shellshock.io/img/favicon.png"}
];

let likes=JSON.parse(localStorage.getItem("likes")||"{}")
let playerName=localStorage.getItem("name")||"Guest"

function toast(msg){
let t=document.getElementById("toast")
t.innerText=msg
t.classList.add("show")
setTimeout(()=>t.classList.remove("show"),1500)
}

function save(){localStorage.setItem("likes",JSON.stringify(likes))}

function setName(){
let n=prompt("Enter name:")
if(!n) return
playerName=n
localStorage.setItem("name",n)
document.getElementById("profile").innerText="Player: "+n
toast("Name set!")
}

function render(list=games){
let g=document.getElementById("grid")
g.innerHTML=""
list.forEach(x=>{
let l=likes[x.name]||0

g.innerHTML+=`
<div class='card'>
<div class='thumb'><img src='${x.img}'></div>
<div class='info'>
<h3>${x.name}</h3>
<div class='tags'>${x.cat}</div>
<div class='badge'>❤️ ${l}</div>
<div class='actions'>
<button class='play' onclick="play('${x.url}')">Play</button>
<button class='like' onclick="like('${x.name}')">❤️</button>
</div>
</div>
</div>`
})
}

function like(name){
likes[name]=(likes[name]||0)+1
save()
render()
toast("+1 Like ❤️")
confetti()
}

function play(url){
document.getElementById("frame").src=url
document.getElementById("player").style.display="block"
}

function search(q){q=q.toLowerCase();render(games.filter(g=>g.name.toLowerCase().includes(q)))}

function showAll(){render(games)}

function showTrending(){render([...games].sort((a,b)=>(likes[b.name]||0)-(likes[a.name]||0)).slice(0,5))}

function showLeaderboard(){
let b=document.getElementById("board")
let s=[...games].sort((a,b)=>(likes[b.name]||0)-(likes[a.name]||0))
b.innerHTML="🏆 Leaderboard<br>"
s.forEach((g,i)=>b.innerHTML+=`${i+1}. ${g.name} - ${likes[g.name]||0}<br>`)
}

// simple confetti
function confetti(){
let c=document.getElementById("confetti")
let ctx=c.getContext("2d")
c.width=window.innerWidth
c.height=window.innerHeight
for(let i=0;i<60;i++){
ctx.fillStyle=`hsl(${Math.random()*360},100%,60%)`
ctx.fillRect(Math.random()*c.width,Math.random()*c.height,4,4)
}
setTimeout(()=>ctx.clearRect(0,0,c.width,c.height),400)
}

render()
document.getElementById("profile").innerText="Player: "+playerName

</script>

</body>
</html>
