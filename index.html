<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dylans Arcade</title>

<style>
:root{
--bg:#060812;
--bg2:#0d1230;
--panel:#141b33;
--text:#eaf0ff;
--accent:#7c5cff;
--blue:#38c6ff;
--red:#ff4d6d;
}

*{box-sizing:border-box;margin:0;padding:0;}

body{
font-family:Arial;
background:linear-gradient(180deg,var(--bg),var(--bg2));
color:var(--text);
min-height:100vh;
overflow-y:auto;
}

/* SIDEBAR */
.sidebar{
position:fixed;
left:0;top:0;
width:260px;height:100vh;
background:#0a1020;
padding:14px;
}

.main{
margin-left:260px;
padding:16px;
}

/* ADD BOX */
.addBox{
background:var(--panel);
padding:12px;
border-radius:14px;
display:grid;
gap:8px;
margin-bottom:14px;
}

.addBox input{
padding:10px;
border:none;
border-radius:10px;
background:#0f1428;
color:white;
}

.addBtn{
padding:10px;
border:none;
border-radius:10px;
background:linear-gradient(135deg,var(--accent),var(--blue));
color:white;
font-weight:bold;
cursor:pointer;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
gap:12px;
}

.card{
background:var(--panel);
padding:12px;
border-radius:14px;
}

/* PLAYER */
.player{
display:none;
position:fixed;
top:0;left:0;
width:100vw;
height:100vh;
background:black;
z-index:50;
}

iframe{
width:100%;
height:100%;
border:none;
}

.exitBtn{
position:absolute;
top:10px;
right:10px;
z-index:60;
padding:10px 14px;
border:none;
border-radius:10px;
background:rgba(0,0,0,.6);
color:white;
cursor:pointer;
}

/* =========================
   PANIC MODE OVERLAY
========================= */

.panic{
display:none;
position:fixed;
top:0;left:0;
width:100vw;
height:100vh;
background:#0f172a;
z-index:99999;
}

.panicHeader{
display:flex;
justify-content:space-between;
align-items:center;
padding:10px 14px;
background:#111c33;
border-bottom:1px solid rgba(255,255,255,.1);
}

.sheet{
display:grid;
grid-template-columns:repeat(10,1fr);
gap:2px;
padding:16px;
}

.cell{
background:#111827;
border:1px solid rgba(255,255,255,.05);
min-height:32px;
font-size:11px;
padding:6px;
}

.tab{
background:#1f2937;
padding:5px 9px;
border-radius:7px;
font-size:11px;
margin-left:6px;
}

.close{
padding:8px 12px;
border:none;
border-radius:8px;
background:#ef4444;
color:white;
cursor:pointer;
}

/* FLOATING BUTTON */
.panicBtn{
position:fixed;
top:10px;
right:10px;
z-index:100000;

padding:8px 10px;
font-size:12px;

border:none;
border-radius:10px;

background:linear-gradient(135deg,var(--accent),var(--blue));
color:white;
font-weight:bold;
cursor:pointer;

opacity:0.85;
}
</style>
</head>

<body>

<!-- ALWAYS VISIBLE PANIC BUTTON -->
<button class="panicBtn" onclick="openPanic()">📊 Panic</button>

<!-- SIDEBAR -->
<div class="sidebar">
<h3>🎮 Arcade</h3>
</div>

<!-- MAIN -->
<div class="main">

<div class="addBox">
<input id="name" placeholder="Game Name">
<input id="cat" placeholder="Category">
<input id="url" placeholder="Game URL">
<input id="img" placeholder="Image URL">
<button class="addBtn" onclick="addGame()">➕ Add Game</button>
</div>

<div class="grid" id="grid"></div>

</div>

<!-- PLAYER -->
<div class="player" id="player">
<button class="exitBtn" onclick="exitGame()">✖ Exit</button>
<iframe id="frame"></iframe>
</div>

<!-- PANIC MODE -->
<div class="panic" id="panic">

<div class="panicHeader">
<div>
📊 Spreadsheet Mode
<span class="tab">File</span>
<span class="tab">Edit</span>
<span class="tab">View</span>
</div>

<button class="close" onclick="exitPanic()">Exit</button>
</div>

<div class="sheet" id="sheet"></div>

</div>

<script>

/* LOAD SAVED GAMES */
let games = JSON.parse(localStorage.getItem("games")) || [
{name:"Bloons",url:"https://kiz10.com/embed-play/bloons-battles/"},
{name:"Paper Flight",url:"https://www.rocketgames.io/embed/paper-flight"},
{name:"Minecraft",url:"https://mcraft.fun"}
];

function save(){
localStorage.setItem("games",JSON.stringify(games));
}

/* ADD GAME */
function addGame(){

let n=document.getElementById("name").value.trim();
let c=document.getElementById("cat").value.trim();
let u=document.getElementById("url").value.trim();
let i=document.getElementById("img").value.trim();

if(!n||!u||!i){
alert("Fill all fields");
return;
}

games.push({name:n,cat:c,url:u,img:i});
save();
render();
}

/* RENDER */
function render(){
let g=document.getElementById("grid");
g.innerHTML="";

games.forEach((x,i)=>{
g.innerHTML+=`
<div class="card">
<h4>${x.name}</h4>
<button onclick="play('${x.url}')">Play</button>
<button onclick="games.splice(${i},1);save();render()">🗑 Delete</button>
</div>`;
});
}

render();

/* PLAY */
function play(url){
document.getElementById("frame").src=url;
document.getElementById("player").style.display="block";
}

/* EXIT GAME */
function exitGame(){
document.getElementById("player").style.display="none";
document.getElementById("frame").src="";
}

/* PANIC MODE */
function openPanic(){

document.getElementById("panic").style.display="block";

let s=document.getElementById("sheet");
s.innerHTML="";

for(let i=0;i<250;i++){
s.innerHTML+=`<div class="cell">${Math.floor(Math.random()*9999)}</div>`;
}
}

function exitPanic(){
document.getElementById("panic").style.display="none";
}

</script>

</body>
</html>
