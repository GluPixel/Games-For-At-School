<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dylans Arcade V6 FIXED</title>

<style>
:root{
--bg:#060812;
--bg2:#0d1230;
--panel:#141b33;
--line:rgba(255,255,255,.08);
--text:#f6f8ff;
--accent:#7c5cff;
--blue:#38c6ff;
}

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:linear-gradient(180deg,var(--bg),var(--bg2));
color:var(--text);
min-height:100vh;
overflow-y:auto;
}

/* SIDEBAR */
.sidebar{
position:fixed;
top:0;
left:0;
width:260px;
height:100vh;
background:#0a1020;
border-right:1px solid var(--line);
padding:14px;
overflow-y:auto;
}

.logo{
font-size:20px;
font-weight:900;
padding:14px;
border-radius:14px;
text-align:center;
background:linear-gradient(135deg,var(--accent),var(--blue));
margin-bottom:10px;
}

.sideBtn{
width:100%;
padding:10px;
margin:6px 0;
border:none;
border-radius:10px;
background:var(--panel);
color:white;
cursor:pointer;
text-align:left;
}

/* MAIN */
.main{
margin-left:260px;
width:calc(100% - 260px);
padding:16px;
}

.hero{
padding:16px;
border-radius:14px;
background:linear-gradient(135deg,var(--accent),#3b82f6);
margin-bottom:14px;
}

/* ADD BOX */
.addBox{
background:var(--panel);
padding:12px;
border-radius:14px;
margin-bottom:14px;
display:grid;
gap:8px;
}

.addBox input{
padding:10px;
border-radius:10px;
border:none;
outline:none;
background:#0f1428;
color:white;
}

.addBtn{
padding:10px;
border:none;
border-radius:10px;
background:linear-gradient(135deg,var(--accent),var(--blue));
color:white;
font-weight:bold;
cursor:pointer;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
gap:12px;
}

/* CARD */
.card{
background:var(--panel);
border-radius:14px;
overflow:hidden;
border:1px solid var(--line);
transition:.2s;
}

.card:hover{
transform:translateY(-6px);
}

.thumb{
height:140px;
display:flex;
align-items:center;
justify-content:center;
background:#0f1428;
}

.thumb img{
max-width:100%;
max-height:100%;
}

.info{
padding:12px;
}

.tags{
font-size:11px;
opacity:.7;
}

.actions{
display:flex;
gap:6px;
margin-top:10px;
}

.play{
flex:1;
padding:10px;
border:none;
border-radius:10px;
background:linear-gradient(135deg,var(--accent),var(--blue));
color:white;
font-weight:bold;
cursor:pointer;
}

.like{
background:#26324d;
border:none;
border-radius:10px;
padding:10px;
color:white;
cursor:pointer;
}

.badge{
font-size:12px;
color:#ffb3c1;
margin-top:6px;
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
<div class="logo">🎮 Arcade V6</div>

<button class="sideBtn" onclick="showAll()">🔥 All Games</button>
<button class="sideBtn" onclick="showTrending()">🏆 Trending</button>
</div>

<!-- MAIN -->
<div class="main">

<div class="hero">
<h2>Dylans Arcade V6 FIXED</h2>
<p>Add games works + logos fixed + stable system</p>
</div>

<!-- ADD GAME -->
<div class="addBox">
<input id="gname" placeholder="Game Name">
<input id="gcat" placeholder="Category">
<input id="gurl" placeholder="Game URL">
<input id="gimg" placeholder="Image URL">
<button class="addBtn" onclick="addGame()">➕ Add Game</button>
</div>

<div class="grid" id="grid"></div>

</div>

<script>

let games = JSON.parse(localStorage.getItem("games") || "null") || [
{
name:"Bloons Battles",
cat:"strategy",
url:"https://kiz10.com/embed-play/bloons-battles/",
img:"https://cdn.kiz10.com/upload/thumbnails/21132/1757453520_bloons-battles.webp"
},
{
name:"Paper Flight",
cat:"flying",
url:"https://www.rocketgames.io/embed/paper-flight",
img:"https://www.speldome.com/wp-content/uploads/thumbs/gamedistribution/P/paper-flight.jpeg"
},
{
name:"Shell Shockers",
cat:"multiplayer",
url:"https://sites.google.com/bluewizard.com/play-shell/home",

/* FIXED LOGO (reliable CDN) */
img:"https://upload.wikimedia.org/wikipedia/en/3/3f/Shell_Shockers_logo.png"
}
];

let likes = JSON.parse(localStorage.getItem("likes") || "{}");

/* SAVE */
function save(){
localStorage.setItem("games",JSON.stringify(games));
}

/* ADD GAME (FIXED) */
function addGame(){

let n=document.getElementById("gname").value.trim();
let c=document.getElementById("gcat").value.trim();
let u=document.getElementById("gurl").value.trim();
let i=document.getElementById("gimg").value.trim();

if(!n || !u || !i){
alert("Please fill all fields");
return;
}

games.push({
name:n,
cat:c,
url:u,
img:i
});

save();
render();

/* clear inputs */
document.getElementById("gname").value="";
document.getElementById("gcat").value="";
document.getElementById("gurl").value="";
document.getElementById("gimg").value="";

alert("Game added!");
}

/* LIKE */
function like(name){
likes[name]=(likes[name]||0)+1;
localStorage.setItem("likes",JSON.stringify(likes));
render();
}

/* RENDER */
function render(list=games){
let g=document.getElementById("grid");
g.innerHTML="";

list.forEach(x=>{
let l=likes[x.name]||0;

g.innerHTML+=`
<div class="card">
<div class="thumb">
<img src="${x.img}">
</div>

<div class="info">
<h3>${x.name}</h3>
<div class="tags">${x.cat}</div>
<div class="badge">❤️ ${l}</div>

<div class="actions">
<button class="play" onclick="window.open('${x.url}','_blank')">Play</button>
<button class="like" onclick="like('${x.name}')">❤️</button>
</div>

</div>
</div>`;
});
}

/* FILTERS */
function showAll(){render(games);}

function showTrending(){
render([...games].sort((a,b)=>(likes[b.name]||0)-(likes[a.name]||0)));
}

/* INIT */
render();

</script>

</body>
</html>
